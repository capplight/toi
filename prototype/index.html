<!doctype html>
<html lang="kk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#FBF8F3">
<title>Той прототипі</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=Lora:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FBF8F3; --surface:#FFFFFF; --surface-2:#F3EEE5; --border:#E4DDD0; --border-strong:#8C8270;
  --ink:#1C2230; --ink-2:#5A6170; --primary:#0E5E6F; --primary-pressed:#0B4B59; --primary-soft:#E6F2F4;
  --gold:#C9A24B; --gold-ink:#8A5A00; --gold-soft:#FFF4DC;
  --success:#1A7F4B; --success-ink:#166B40; --success-soft:#E7F5EC;
  --danger:#B42318; --danger-soft:#FDECEA; --dup:#5B3FA8; --dup-soft:#EFEAFB;
  --seat-taken:#7A808C; --seat-free:#1A7F4B; --scrim:rgba(28,34,48,.48);
  --sh-card:0 1px 2px rgba(28,34,48,.06),0 2px 8px rgba(28,34,48,.06);
  --sh-bar:0 -2px 12px rgba(28,34,48,.10); --sh-sheet:0 -8px 24px rgba(28,34,48,.16);
  --font:"Golos Text","Noto Sans",system-ui,sans-serif; --serif:"Lora","Noto Serif",Georgia,serif;
  --tabs-h:0px; --sticky-h:0px; --safe-b:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:1.125rem;line-height:1.45;overflow-x:hidden}
button,input{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--primary);outline-offset:2px}
.app{max-width:480px;margin:0 auto;min-height:100vh;position:relative}
.vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.num{font-variant-numeric:tabular-nums}
.ic{flex:none;vertical-align:middle}

/* header */
.hdr{position:sticky;top:0;z-index:20;height:56px;display:flex;align-items:center;gap:4px;padding:0 8px 0 4px;background:var(--bg);border-bottom:1px solid var(--border)}
.hdr h1{font-size:1.5rem;line-height:30px;font-weight:700;margin:0 0 0 12px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr .icon-btn + h1{margin-left:0}
.icon-btn{width:48px;height:48px;border:0;background:transparent;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;flex:none;color:var(--ink)}
.icon-btn:active{background:var(--surface-2)}
.lang{display:flex;border:1.5px solid var(--primary);border-radius:12px;overflow:hidden;flex:none}
.lang button{width:48px;height:44px;border:0;background:var(--surface);color:var(--primary);font-size:1rem;font-weight:600}
.lang button[aria-pressed="true"]{background:var(--primary);color:#fff}

main{padding:0 16px calc(24px + var(--sticky-h) + var(--tabs-h) + var(--safe-b))}
main.enter{animation:enter .22s ease-out}
@keyframes enter{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}
main.enter-back{animation:enterb .22s ease-out}
@keyframes enterb{from{opacity:0;transform:translateX(-24px)}to{opacity:1;transform:none}}

h2.h2,.h2{font-size:1.25rem;line-height:26px;font-weight:700;margin:24px 0 12px}
.ink2{color:var(--ink-2)}
.small{font-size:1rem;line-height:24px}
.p{margin:12px 0}

/* event head */
.evt{text-align:center;padding:20px 0 4px}
.evt-title{font-family:var(--serif);font-weight:600;font-size:1.625rem;line-height:32px;margin:0}
.orn-div{display:flex;align-items:center;justify-content:center;gap:0;margin:8px auto 8px;width:160px}
.orn-div i{display:block;height:1px;background:var(--gold);flex:1}
.evt-meta{font-size:1rem;color:var(--ink-2);margin:0}

/* buttons */
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:56px;padding:8px 16px;border-radius:12px;border:0;font-size:1.125rem;line-height:24px;font-weight:600;text-align:center;text-decoration:none;transition:transform .08s}
.btn:active{transform:scale(.98)}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:active{background:var(--primary-pressed)}
.btn-wa{background:var(--success);color:#fff}
.btn-wa:active{background:#146a3e}
.btn-sec{background:var(--surface);color:var(--primary);border:1.5px solid var(--primary);min-height:52px}
.btn-sec:active{background:var(--primary-soft)}
.btn-wao{background:var(--surface);color:var(--success);border:1.5px solid var(--success);min-height:48px}
.btn-danger{background:var(--surface);color:var(--danger);border:1.5px solid var(--danger);min-height:52px}
.btn-danger-fill{background:var(--danger);color:#fff;min-height:52px}
.btn-text{background:transparent;color:var(--primary);min-height:48px;width:auto;margin:0 auto;padding:8px 12px}
.btn-text:active{text-decoration:underline}
.btn-sm{min-height:48px}
.btn-row{display:flex;gap:8px}
.btn-row > .btn{flex:1;width:auto}
.btn[aria-disabled="true"]{opacity:.4}
.btn-icon{width:48px;height:48px;min-height:48px;padding:0;border-radius:12px;background:var(--surface-2);color:var(--ink);border:0;display:inline-flex;align-items:center;justify-content:center;flex:none}
.btn-icon[aria-disabled="true"]{opacity:.4}
.stack > * + *{margin-top:8px}

/* sticky main button */
.sticky{position:fixed;left:50%;transform:translateX(-50%);width:100%;max-width:480px;bottom:calc(var(--tabs-h) + var(--safe-b));padding:12px 16px;background:var(--bg);box-shadow:var(--sh-bar);z-index:25}
.sticky:empty{display:none}
.no-tabs .sticky{padding-bottom:calc(12px + var(--safe-b));bottom:0}

/* tabs */
.tabs{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:480px;display:flex;background:var(--surface);box-shadow:var(--sh-bar);z-index:26;padding-bottom:var(--safe-b)}
.tabs button{flex:1;height:64px;border:0;background:var(--surface);color:var(--ink-2);display:flex;align-items:center;justify-content:center;gap:8px;font-size:1rem;font-weight:600;position:relative;border-top:3px solid transparent}
.tabs button[aria-current="page"]{color:var(--primary);background:var(--primary-soft);border-top-color:var(--primary)}
.tab-ic{position:relative;display:inline-flex}
.dot{position:absolute;right:-7px;top:-3px;width:10px;height:10px;border-radius:50%;background:var(--danger);border:1.5px solid #fff}

/* counters */
.counters{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.counter{min-height:96px;background:var(--surface);border-radius:16px;box-shadow:var(--sh-card);border:2.5px solid transparent;padding:8px 10px;text-align:left;display:flex;flex-direction:column;align-items:flex-start;min-width:0}
.counter[aria-pressed="true"]{border-color:var(--primary);background:var(--primary-soft)}
.counter .stat{font-size:2rem;line-height:36px;font-weight:700;font-variant-numeric:tabular-nums}
.counter .lb{font-size:1rem;line-height:20px;font-weight:500;word-break:break-word}
.counter .lb2{font-size:1rem;line-height:20px;color:var(--ink-2)}
.c-yes .ic{color:var(--success)} .c-inv .ic{color:var(--gold-ink)} .c-no .ic{color:var(--ink-2)}
.total-line{font-size:1rem;color:var(--ink-2);margin:8px 0 0}

/* banners */
.banner{display:flex;align-items:center;gap:12px;width:100%;min-height:64px;padding:12px 16px;border-radius:16px;border:0;text-align:left;margin-top:12px}
.banner .bt{font-size:1.125rem;line-height:24px;font-weight:600}
.banner .bs{font-size:1rem;line-height:22px}
.banner > div{flex:1;min-width:0}
.bn-gold{background:var(--gold-soft);color:var(--gold-ink)}
.bn-gold .bt{color:var(--ink)} .bn-gold .bs{color:var(--gold-ink)}
.bn-danger{background:var(--danger-soft);color:var(--danger)}
.bn-danger .bs{color:var(--ink)}
.bn-dup{background:var(--dup-soft);color:var(--dup)}
.bn-dup .bs{color:var(--ink)}
.bn-view{background:var(--surface-2);color:var(--ink-2)}
.bn-view .bt{color:var(--ink)}
.bn-net{background:var(--gold-soft);color:var(--gold-ink)}

/* fields */
.field{margin-top:20px}
.field label,.flabel{display:block;font-size:1rem;font-weight:600;margin-bottom:8px}
.input{width:100%;height:56px;border:1.5px solid var(--border-strong);border-radius:12px;background:var(--surface);padding:0 16px;font-size:1.125rem}
.input::placeholder{color:var(--ink-2)}
.input:focus{outline:none;border:2.5px solid var(--primary);padding:0 15px}
.input[aria-invalid="true"]{border:2.5px solid var(--danger);padding:0 15px}
.phone-wrap{position:relative}
.phone-wrap .pre{position:absolute;left:16px;top:0;height:56px;display:flex;align-items:center;color:var(--ink-2);pointer-events:none;border-right:1px solid var(--border);padding-right:10px}
.phone-wrap .input{padding-left:62px}
.phone-wrap .input:focus,.phone-wrap .input[aria-invalid="true"]{padding-left:61px}
.hint{font-size:1rem;color:var(--ink-2);margin:6px 0 0}
.err{font-size:1rem;color:var(--danger);margin:6px 0 0;display:flex;gap:6px;align-items:flex-start}
.err .ic{margin-top:2px}
.search{position:relative;margin-top:12px}
.search .ic{position:absolute;left:14px;top:16px;color:var(--ink-2)}
.search .input{padding-left:48px}
.search .input:focus{padding-left:47px}

/* category tiles */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tile{min-height:56px;border-radius:12px;border:1.5px solid var(--border-strong);background:var(--surface);font-size:1.125rem;line-height:22px;font-weight:500;padding:8px 10px;display:flex;align-items:center;justify-content:center;gap:6px;text-align:center;word-break:break-word}
.tile[aria-checked="true"]{background:var(--primary-soft);border:2.5px solid var(--primary);color:var(--primary);font-weight:600;padding:7px 9px}
.tile .sub{display:block;font-size:1rem;font-weight:400;color:var(--ink-2)}
.tile-add{border-style:dashed;color:var(--primary);font-weight:600}

/* stepper */
.stepper{display:flex;align-items:center;justify-content:space-between;gap:8px}
.step-btn{width:64px;height:64px;border-radius:16px;border:0;background:var(--surface-2);font-size:2rem;font-weight:600;display:flex;align-items:center;justify-content:center;flex:none}
.step-btn:active{transform:scale(.96)}
.step-val{flex:1;min-height:64px;display:flex;flex-direction:column;align-items:center;justify-content:center;border:0;background:transparent;border-radius:12px}
.step-val b{font-size:2rem;line-height:36px;font-weight:700;font-variant-numeric:tabular-nums}
.step-val span{font-size:1rem;color:var(--ink-2)}
.step-val input{width:96px;height:56px;text-align:center;font-size:2rem;font-weight:700;border:2.5px solid var(--primary);border-radius:12px}
.step-msg{min-height:24px;font-size:1rem;color:var(--gold-ink);text-align:center;margin:4px 0 0}

/* guest cards */
.ghead{font-size:1rem;font-weight:700;color:var(--ink-2);letter-spacing:.5px;margin:24px 0 8px}
.gcard{background:var(--surface);border-radius:16px;box-shadow:var(--sh-card);padding:14px 16px;margin-top:8px;min-height:72px;cursor:pointer;transition:background .6s}
.gcard:focus-visible{outline:3px solid var(--primary)}
.gcard.flash{background:var(--primary-soft)}
.gname{font-size:1.125rem;line-height:24px;font-weight:600;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.gmeta{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin-top:6px;font-size:1rem;color:var(--ink-2)}
.gact{margin-top:10px;display:flex;align-items:center;gap:12px}
.gact .btn{flex:none;width:auto;padding:8px 14px}
.gact .btn-wa{flex:1}
.gact .when{font-size:1rem;color:var(--ink-2)}
.badge{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:999px;font-size:1rem;font-weight:500;white-space:nowrap}
.b-new{background:#fff;color:var(--ink-2);border:1.5px dashed var(--border-strong)}
.b-inv{background:var(--gold-soft);color:var(--gold-ink)}
.b-yes{background:var(--success-soft);color:var(--success-ink)}
.b-no{background:#EEF0F3;color:var(--ink-2)}
.filter-line{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:16px;font-size:1rem;font-weight:600}
.filter-line .btn{width:auto}
.empty{text-align:center;padding:32px 8px}
.empty .motif{opacity:.6}
.empty p{font-size:1.125rem}
.skel{background:var(--surface-2);border-radius:16px;animation:pulse 1.2s ease-in-out infinite alternate}
@keyframes pulse{from{opacity:1}to{opacity:.45}}

/* rows / kv */
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:1.125rem;margin:16px 0}
.kv dt{color:var(--ink-2);font-size:1rem;padding-top:2px}
.kv dd{margin:0}
.box{background:var(--surface);border-radius:16px;box-shadow:var(--sh-card);padding:16px;margin-top:12px}
.box-dup{border:2px solid var(--dup)}
.box-danger{border:2px solid var(--danger)}
.alert{border-radius:16px;padding:14px 16px;margin-top:4px}
.alert-danger{background:var(--danger-soft)}
.alert-danger .at{color:var(--danger);font-weight:600;display:flex;gap:8px;align-items:center}
.ok-line{color:var(--success-ink);font-weight:600;display:flex;gap:8px;align-items:center}
.danger-line{color:var(--danger);font-weight:600;display:flex;gap:8px;align-items:center}

/* link rows */
.links{background:var(--surface);border-radius:16px;box-shadow:var(--sh-card);margin-top:16px;overflow:hidden}
.lrow{display:flex;align-items:center;gap:12px;width:100%;min-height:64px;padding:10px 16px;border:0;background:transparent;text-align:left}
.lrow + .lrow{border-top:1px solid var(--border)}
.lrow > div{flex:1;min-width:0}
.lrow .lt{font-weight:600}
.lrow .ls{font-size:1rem;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lrow:active{background:var(--surface-2)}

/* hall */
.summary h2{margin:16px 0 4px}
.seg{display:flex;background:var(--surface-2);border-radius:12px;padding:3px;margin-top:16px}
.seg button{flex:1;min-height:48px;border:0;border-radius:10px;background:transparent;font-size:1rem;font-weight:600;color:var(--ink-2);display:flex;align-items:center;justify-content:center;gap:8px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--primary);box-shadow:var(--sh-card)}
.hallbox{background:var(--surface-2);border-radius:16px;margin-top:12px;overflow:hidden}
.hall-svg{display:block;width:100%;height:auto;font-family:var(--font)}
.hall-svg text{font-family:var(--font)}
.hall-svg .tbl{cursor:pointer;outline:none}
.hall-svg .tbl:focus-visible .cell{stroke:var(--primary);stroke-width:3}
.hall-svg .cell{fill:transparent;transition:fill .12s}
.hall-svg .tbl.tap .cell{fill:var(--primary-soft)}
.hall-svg .chair{transition:fill .3s,stroke .3s}
.hall-svg .dim{opacity:.3}
.hall-svg .dim45{opacity:.45}
.pulse{transform-box:fill-box;transform-origin:center;animation:ring .3s ease-in-out 4 alternate}
@keyframes ring{from{transform:scale(1)}to{transform:scale(1.15)}}
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:1rem;margin-top:12px;color:var(--ink)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.tcard{background:var(--surface);border-radius:16px;box-shadow:var(--sh-card);margin-top:8px;border:2px solid transparent}
.tcard.over{border-color:var(--danger)}
.tcard-h{display:flex;align-items:center;gap:8px;width:100%;min-height:64px;border:0;background:transparent;padding:10px 16px;text-align:left}
.tcard-h > div{flex:1;min-width:0}
.tcard-h .tt{font-weight:600;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center}
.tcard-h .tc{font-size:1rem;color:var(--ink-2)}
.tcard-b{padding:0 16px 12px}
.fam{display:flex;gap:12px;padding:12px 0;border-top:1px solid var(--border)}
.fam:first-child{border-top:0}
.fam-n{width:28px;height:28px;border-radius:50%;background:var(--seat-taken);color:#fff;font-size:1rem;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none;margin-top:0}
.fam > div{flex:1;min-width:0}
.fam .fn{font-weight:600}
.fam .fm{font-size:1rem;color:var(--ink-2)}
.fam .btn{margin-top:8px;width:auto;padding:8px 16px}
.fam .btn-text{margin:4px 0 0;padding:8px 0;min-height:48px}
.tsheet-svg{display:block;margin:8px auto 0;width:200px;height:200px}
.center{text-align:center}

/* order */
.orow{display:flex;align-items:center;gap:10px;min-height:72px;padding:8px 12px;border-top:1px solid var(--border);transition:transform .2s}
.orow:first-child{border-top:0}
.orow .on{font-size:1.25rem;font-weight:700;width:24px;text-align:center;flex:none}
.orow .om{width:8px;height:32px;border-radius:4px;flex:none;border:1px solid rgba(28,34,48,.15)}
.orow > div.ot{flex:1;min-width:0}
.orow .oname{font-weight:600;line-height:22px;word-break:break-word}
.orow .osub{font-size:1rem;color:var(--ink-2)}
.orow .obtns{display:flex;gap:8px;flex:none}
.orow.moved{animation:moved .2s ease-out}
@keyframes moved{from{background:var(--primary-soft)}to{background:transparent}}

/* history */
.hday{font-size:1rem;font-weight:700;color:var(--ink-2);letter-spacing:.5px;margin:24px 0 8px}
.hitem{padding:14px 16px;border-top:1px solid var(--border)}
.hitem:first-child{border-top:0}
.hitem .hw{font-size:1rem;color:var(--ink-2)}
.hitem .ht{font-weight:600}
.hitem.undone .ht,.hitem.undone .hl{text-decoration:line-through;opacity:.6}
.hitem .btn{width:auto;margin-top:8px;padding:8px 16px}

/* move */
.mlist .btn{justify-content:space-between;margin-top:8px}
.disclose{display:flex;align-items:center;gap:8px;min-height:48px;border:0;background:transparent;color:var(--primary);font-weight:600;padding:0;margin-top:12px}

/* hall setup */
.ltiles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ltile{min-height:96px;border-radius:12px;border:1.5px solid var(--border-strong);background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-size:1.125rem;font-weight:500;position:relative;padding:8px}
.ltile[aria-checked="true"]{background:var(--primary-soft);border:2.5px solid var(--primary);color:var(--primary);font-weight:600}
.ltile .ck{position:absolute;left:8px;top:8px}
.sumcard{background:var(--surface);border-radius:16px;box-shadow:var(--sh-card);padding:16px;margin-top:24px;border:2px solid transparent}
.sumcard.bad{border-color:var(--danger)}
.sumcard .stat{font-size:2rem;line-height:36px;font-weight:700}
.sumcard hr{border:0;border-top:1px solid var(--border);margin:12px 0}

/* start */
.rcard{display:flex;flex-direction:column;justify-content:center;width:100%;min-height:72px;border-radius:16px;border:1.5px solid var(--border-strong);background:var(--surface);padding:10px 16px;text-align:left;margin-top:8px}
.rcard[aria-checked="true"]{border:2.5px solid var(--primary);background:var(--primary-soft);padding:9px 15px}
.rcard .rt{font-weight:600;display:flex;gap:8px;align-items:center}
.rcard .rs{font-size:1rem;color:var(--ink-2)}
.chk{display:flex;align-items:center;gap:12px;min-height:56px;font-size:1.125rem;margin-top:16px;cursor:pointer}
.chk input{width:28px;height:28px;accent-color:var(--primary);flex:none}

/* sheet */
.sheet-wrap{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet-wrap[hidden]{display:none}
.scrim{position:absolute;inset:0;background:var(--scrim);opacity:0;transition:opacity .2s}
.sheet{position:relative;width:100%;max-width:480px;max-height:90vh;max-height:90dvh;background:var(--surface);border-radius:24px 24px 0 0;box-shadow:var(--sh-sheet);display:flex;flex-direction:column;transform:translateY(100%);transition:transform .25s cubic-bezier(.2,.8,.2,1)}
.sheet-wrap.open .scrim{opacity:1}
.sheet-wrap.open .sheet{transform:none}
.sheet-handle{width:40px;height:4px;border-radius:2px;background:var(--border);margin:8px auto 0;flex:none}
.sheet-head{display:flex;align-items:center;gap:8px;min-height:64px;padding:0 8px 0 16px;flex:none}
.sheet-head h2{flex:1;margin:0;font-size:1.25rem;line-height:26px;font-weight:700;outline:none}
.sheet-body{overflow-y:auto;padding:0 16px 16px;flex:1 1 auto;overscroll-behavior:contain}
.sheet-foot{flex:none;padding:12px 16px calc(12px + var(--safe-b));background:var(--surface);box-shadow:var(--sh-bar)}
.sheet-foot:empty{display:none}
.sheet-foot > * + *{margin-top:8px}

function makeToken(id){
  if (id === 'f06') return 'a7K2pQ';
  var a = 'abcdefghijkmnpqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789', h = 2166136261, s = '';

  for (var j = 0; j < 6; j++) { s += a[h % a.length]; h = Math.imul(h ^ (h >>> 13), 2654435761) >>> 0; }

}
function atTime(now, daysAgo, hh, mm){ var d = new Date(now - daysAgo * DAY); d.setHours(hh, mm, 0, 0); return d.getTime(); }

function seatsOf(f){
  if (f.status === 'no') return 0;
  if (f.status === 'yes') return f.confirmed || 0;
  return f.expected || 0;
}

/* Tables: numbering left->right, top->bottom; proximity: level by level, central columns first. */
function layoutTables(hall){
  var C = hall.cols, N = hall.count, levels = Math.ceil(N / C);
  var colOrder = C === 4 ? [1, 2, 0, 3] : [0, 1];
  var tables = [], num = 1, L, c;
  for (L = 0; L < levels; L++){
    var inLevel = Math.min(C, N - L * C);
    var cols = colOrder.slice(0, inLevel).sort(function(a, b){ return a - b; });
    for (c = 0; c < cols.length; c++) tables.push({num:num++, level:L, col:cols[c], cap:hall.seats});
  }
  var prox = [];
  for (L = 0; L < levels; L++){
    for (c = 0; c < colOrder.length; c++){
      for (var k = 0; k < tables.length; k++) if (tables[k].level === L && tables[k].col === colOrder[c]) prox.push(tables[k]);
    }
  }
  prox.forEach(function(t, i){ t.pos = i; });
  return {tables:tables, prox:prox, levels:levels};
}

/* Algorithm 6.1 */
function autoSeat(st){
  if (!st.hall) { st.families.forEach(function(f){ if (!f.locked) f.table = null; }); return {unplaced:[]}; }
  var lay = layoutTables(st.hall), byNum = {}, unplaced = [];
  lay.tables.forEach(function(t){ byNum[t.num] = {cap:t.cap, used:0}; });
  var fams = st.families, seq = 0;
  // step 1-2: locked families (drop lock if table vanished or no seats)
  var locked = fams.filter(function(f){ return f.locked; }).sort(function(a, b){ return a.seq - b.seq; });
  locked.forEach(function(f){
    if (!byNum[f.table] || seatsOf(f) === 0) { f.locked = false; f.lockedBy = null; f.table = null; return; }
    byNum[f.table].used += seatsOf(f); f.seq = seq++;
  });
  fams.forEach(function(f){ if (!f.locked) f.table = null; });
  // step 4
  var prevLast = null, prevCat = null, started = false;
  st.order.forEach(function(cid){
    var list = fams.filter(function(f){ return f.cat === cid && !f.locked && seatsOf(f) > 0; });
    if (!list.length) return;                                   // step 5
    list = list.map(function(f, i){ return {f:f, i:i}; })
      .sort(function(a, b){ return (seatsOf(b.f) - seatsOf(a.f)) || (a.i - b.i); })
      .map(function(x){ return x.f; });
    var start = 0;
    if (started) start = (prevCat === st.order[0]) ? prevLast + 1 : prevLast;
    var last = start;
    list.forEach(function(f){
      var s = seatsOf(f);
      for (var p = start; p < lay.prox.length; p++){
        var t = lay.prox[p], b = byNum[t.num];
        if (b.cap - b.used >= s){ b.used += s; f.table = t.num; f.seq = seq++; if (p > last) last = p; return; }
      }
      f.table = null; unplaced.push(f);
    });
    prevLast = last; prevCat = cid; started = true;
  });
  st.seq = Math.max(st.seq || 0, seq + 1);
  return {unplaced:unplaced};
}

function tableStats(st){
  if (!st.hall) return {tables:[], byNum:{}, over:[], unplaced:[], used:0};
  var lay = layoutTables(st.hall), byNum = {};
  lay.tables.forEach(function(t){ t.used = 0; t.fams = []; byNum[t.num] = t; });
  var unplaced = [];
  st.families.forEach(function(f){
    var s = seatsOf(f); if (!s) return;
    if (f.table && byNum[f.table]) { byNum[f.table].used += s; byNum[f.table].fams.push(f); }
    else unplaced.push(f);
  });
  lay.tables.forEach(function(t){
    t.fams.sort(function(a, b){ return a.seq - b.seq; });
    var by = {}; t.fams.forEach(function(f){ by[f.cat] = (by[f.cat] || 0) + seatsOf(f); });
    var best = null, bv = -1;
    st.order.forEach(function(cid){ if ((by[cid] || 0) > bv && by[cid]) { bv = by[cid]; best = cid; } });
    t.mainCat = best;
  });
  return {tables:lay.tables, prox:lay.prox, levels:lay.levels, byNum:byNum,
    over: lay.tables.filter(function(t){ return t.used > t.cap; }), unplaced:unplaced,
    usedTables: lay.tables.filter(function(t){ return t.used > 0; }).length};
}

var STOP = {'ағай':1,'апай':1,'отбасы':1,'құда':1,'құдағи':1,'нағашы':1,'мен':1,'әже':1,'ата':1};
function nameKey(n){
  var w = String(n || '').toLowerCase().replace(/\([^)]*\)/g, ' ').split(/[\s,.;:«»"!?]+/)
    .filter(function(x){ return x && !STOP[x]; });
  return w[0] || '';
}
function similar(a, b){ var ka = nameKey(a), kb = nameKey(b); return !!ka && ka === kb; }
function pairKey(a, b){ return a < b ? a + '|' + b : b + '|' + a; }
function dupPairs(st){
  var fs = st.families.filter(function(f){ return f.status !== 'no'; }), out = [];
  for (var i = 0; i < fs.length; i++) for (var j = i + 1; j < fs.length; j++){
    if (similar(fs[i].name, fs[j].name) && st.checked.indexOf(pairKey(fs[i].id, fs[j].id)) < 0){
      var p = [fs[i], fs[j]];
      p.sort(function(a, b){ return (a.table || 999) - (b.table || 999); });
      out.push(p);
    }
  }
  return out;
}
function totals(st){
  var yes = 0, pend = 0;
  st.families.forEach(function(f){ if (f.status === 'yes') yes += f.confirmed || 0; else if (f.status !== 'no') pend += f.expected || 0; });
  var cap = st.hall ? st.hall.count * st.hall.seats : 0;
  return {yes:yes, pend:pend, total:yes + pend, cap:cap, free:cap - yes - pend};
}
if (typeof module !== 'undefined') module.exports = {makeSample:makeSample, makeEmpty:makeEmpty, autoSeat:autoSeat, tableStats:tableStats, dupPairs:dupPairs, totals:totals, seatsOf:seatsOf, similar:similar, layoutTables:layoutTables};

/* ============ navigation ============ */
var navIdx = 0, navStack = [], canPush = true, curPath = null, pendingAfter = null, sheetCtx = null, sheetPushed = false, lastFocus = null;
function parseRoute(){
  var h = (location.hash || '').replace(/^#/, ''); var parts = h.split('?');
  var q = parts[1] || '', m = /(?:^|&)sheet=([^&]*)/.exec(q);
  return {path: parts[0] || '', sheet: m ? m[1] : null};
}
function setUrl(url, push){
  if (!canPush) return false;
  try {
    if (push) { navIdx++; history.pushState({idx:navIdx}, '', url); }
    else history.replaceState({idx:navIdx}, '', url);
    navStack[navIdx] = url; navStack.length = navIdx + 1;
    return true;
  } catch (e) { canPush = false; return false; }
}
var navDir = 1;
function go(path, opt){
  opt = opt || {};
  if (sheetCtx) closeSheetDom();
  navDir = opt.back ? -1 : 1;
  if (!setUrl('#' + path, !opt.replace)) { if (location.hash !== '#' + path) { curPath = null; location.hash = path; } }
  render();
}
function backTo(path, after){
  var target = '#' + path;
  for (var i = navIdx - 1; i >= 0; i--){
    if (navStack[i] === target){ pendingAfter = after || null; navDir = -1; history.go(i - navIdx); return; }
  }
  go(path, {replace:true, back:true}); if (after) after();
}
function goBack(fallback){
  if (canPush && navIdx > 0) { navDir = -1; history.back(); }
  else go(fallback, {replace:true, back:true});
}
function onPop(e){
  if (e && e.state && typeof e.state.idx === 'number') navIdx = e.state.idx;
  var r = parseRoute();
  // leave-guard for dirty guest form
  if (isFormPath(curPath) && r.path !== curPath && ui.form && formDirty() && !ui.allowLeave){
    setUrl('#' + curPath, true);
    if (sheetCtx) closeSheetDom();
    openLeaveSheet();
    return;
  }
  if (sheetCtx && !r.sheet) closeSheetDom();
  if (r.path !== curPath) render(); else refresh();
  var a = pendingAfter; pendingAfter = null; if (a) a();
}
window.addEventListener('popstate', onPop);
window.addEventListener('hashchange', function(){ var r = parseRoute(); if (r.path !== curPath) { if (sheetCtx) closeSheetDom(); render(); } });
function isFormPath(p){ return p === '/guests/add' || /^\/guests\/edit\//.test(p || ''); }

function hasHallProblems(){ if (!state.hall) return false; var s = tableStats(state); return s.over.length > 0 || s.unplaced.length > 0 || dupPairs(state).length > 0; }

var SCREENS = [];
function route(re, fn){ SCREENS.push([re, fn]); }
function render(keep){
  var r = parseRoute(), path = r.path;
  if (!path || (!state.started && path !== '/start')) { path = state.started ? '/guests' : '/start'; setUrl('#' + path, false); }
  if (canPush && r.sheet && !sheetCtx) setUrl('#' + path, false);
  var prev = curPath; curPath = path;
  if (!keep && prev !== path){
    if (prev && prev.indexOf('/hall') === 0 && path !== '/hall') ui.dup = null;
    if (!isFormPath(path)) ui.allowLeave = false;
  }
  var out = null;
  for (var i = 0; i < SCREENS.length; i++){ var m = SCREENS[i][0].exec(path); if (m) { out = SCREENS[i][1](m); break; } }
  if (!out) { go(state.started ? '/guests' : '/start', {replace:true}); return; }
  if (out.redirect) { go(out.redirect, {replace:true}); return; }
  document.documentElement.lang = lang === 'ru' ? 'ru' : 'kk';
  document.title = t('Той прототипі', 'Прототип тоя');
  $('hdr').innerHTML = out.hdr || '';
  var main = $('main');
  main.innerHTML = out.body || '';
  $('sticky').innerHTML = out.sticky || '';
  var tabs = $('tabs');
  if (out.tabs) { tabs.hidden = false; tabs.innerHTML = tabsHtml(); } else { tabs.hidden = true; tabs.innerHTML = ''; }
  document.body.classList.toggle('no-tabs', !out.tabs);
  layoutVars();
  renderFloat();
  if (!keep && prev !== path){
    main.classList.remove('enter', 'enter-back'); void main.offsetWidth;
    main.classList.add(navDir < 0 ? 'enter-back' : 'enter');
    window.scrollTo(0, 0);
    navDir = 1;
    if (out.focus) { var fe = document.querySelector(out.focus); if (fe) fe.focus({preventScroll:true}); }
  }
  if (out.after) out.after();
}
function refresh(){ var y = window.scrollY; render(true); window.scrollTo(0, y); if (sheetCtx) paintSheet(); }
function layoutVars(){
  var tabs = $('tabs'), st = $('sticky');
  document.documentElement.style.setProperty('--tabs-h', tabs.hidden ? '0px' : '64px');
  document.documentElement.style.setProperty('--sticky-h', st.innerHTML ? st.offsetHeight + 'px' : '0px');
}
window.addEventListener('resize', layoutVars);

/* ============ toast ============ */
var toastTimer = null, toastUndo = null;
function toast(msg, undo){
  var el = $('toast');
  toastUndo = undo || null;
  el.innerHTML = '<span>' + esc(msg) + '</span>' + (undo ? '<button data-act="toastUndo">' + ic('undo-2', 20) + t('Қайтару', 'Вернуть') + '</button>' : '');
  el.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(hideToast, 8000);
}
function hideToast(){ $('toast').hidden = true; toastUndo = null; }
$('toast').addEventListener('click', function(){ clearTimeout(toastTimer); });

/* ============ sheet ============ */
function openSheet(name, build, opts){
  opts = opts || {};
  var replacing = !!sheetCtx;
  if (!replacing) lastFocus = document.activeElement;
  sheetCtx = {name:name, build:build};
  if (!replacing) { sheetPushed = setUrl('#' + curPath + '?sheet=' + name, true); }
  else if (sheetPushed) setUrl('#' + curPath + '?sheet=' + name, false);
  var w = $('sheet');
  w.hidden = false;
  paintSheet(true);
  if (!replacing) requestAnimationFrame(function(){ requestAnimationFrame(function(){ w.classList.add('open'); }); });
}
function paintSheet(focus){
  if (!sheetCtx) return;
  var c = sheetCtx.build(), w = $('sheet');
  var bodyScroll = w.querySelector('.sheet-body'); var y = bodyScroll ? bodyScroll.scrollTop : 0;
  w.innerHTML = '<div class="scrim" data-act="sheetClose"></div>' +
    '<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">' +
    '<div class="sheet-handle" aria-hidden="true"></div>' +
    '<div class="sheet-head"><h2 id="sheet-title" tabindex="-1">' + (c.titleHtml || esc(c.title || '')) + '</h2>' +
    '<button class="icon-btn" data-act="' + (c.closeAct || 'sheetClose') + '" aria-label="' + t('Жабу', 'Закрыть') + '">' + ic('x') + '</button></div>' +
    '<div class="sheet-body">' + (c.body || '') + '</div>' +
    '<div class="sheet-foot">' + (c.foot || '') + '</div></div>';
  if (!focus) { var b = w.querySelector('.sheet-body'); if (b) b.scrollTop = y; }
  if (focus) { var h = $('sheet-title'); if (h) h.focus({preventScroll:true}); }
  if (c.after) c.after();
}
function closeSheetDom(){
  var w = $('sheet');
  sheetCtx = null; sheetPushed = false; ui.gs = null;
  w.classList.remove('open');
  setTimeout(function(){ if (!sheetCtx) { w.hidden = true; w.innerHTML = ''; } }, 200);
  if (lastFocus && document.body.contains(lastFocus)) { try { lastFocus.focus({preventScroll:true}); } catch (e) {} }
}
function closeSheet(after){
  if (sheetPushed && canPush) { pendingAfter = after || null; history.back(); }
  else { closeSheetDom(); refresh(); if (after) after(); }
}
/* sheet -> other screen (replace sheet history entry) */
function sheetGo(path){ closeSheetDom(); go(path, {replace:true}); }
document.addEventListener('keydown', function(e){
  if (e.key === 'Escape' && sheetCtx) { e.preventDefault(); act('sheetClose', document.createElement('i'), e); }
  if (e.key === 'Tab' && sheetCtx){
    var f = Array.prototype.slice.call($('sheet').querySelectorAll('button,input,[tabindex="0"],h2[tabindex]')).filter(function(x){ return x.offsetParent !== null; });
    if (!f.length) return; var first = f[0], last = f[f.length - 1];
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  }
  if ((e.key === 'Enter' || e.key === ' ') && e.target && e.target.getAttribute && e.target.getAttribute('role') === 'button' && e.target.tagName !== 'BUTTON'){
    e.preventDefault(); e.target.dispatchEvent(new MouseEvent('click', {bubbles:true}));
  }
});

/* ============ hall SVG ============ */
var COL = {taken:'#7A808C', free:'#FFFFFF', freeStroke:'#1A7F4B', danger:'#B42318', dup:'#5B3FA8', ink:'#1C2230', ink2:'#5A6170', border:'#8C8270', gold:'#C9A24B', goldInk:'#8A5A00', primary:'#0E5E6F', success:'#1A7F4B'};
function chairOwners(tb){
  var owners = [], i = 0;
  tb.fams.forEach(function(f, fi){ var s = seatsOf(f); for (var k = 0; k < s; k++) owners.push({f:f, fi:fi, first:k === 0}); });

}
function tableAria(tb){

  s += '<g class="tbl" role="button" tabindex="0" data-act="couple" aria-label="' + t('Жастар үстелі', 'Стол молодых') + '"><rect class="cell" x="60" y="24" width="208" height="64" rx="12"/>' +
    '<svg x="148" y="26" width="32" height="16" viewBox="0 0 48 24" fill="none" stroke="' + COL.gold + '" stroke-width="2" stroke-linecap="round" aria-hidden="true">' + MOTIF_PATHS + '</svg>' +
    '<rect x="98" y="46" width="132" height="36" rx="18" fill="#FFFFFF" stroke="' + COL.gold + '" stroke-width="2"/>' +
    '<text x="164" y="64" text-anchor="middle" dominant-baseline="central" font-size="16" font-weight="700" fill="' + COL.ink + '">' + t('Жастар үстелі', 'Стол молодых') + '</text>' +
    '<circle cx="82" cy="64" r="6" fill="' + COL.gold + '" aria-hidden="true"/><circle cx="246" cy="64" r="6" fill="' + COL.gold + '" aria-hidden="true"/></g>';
  var mf = o.mode === 'move' ? fam(o.fid) : null, need = mf ? seatsOf(mf) : 0;
  S.tables.forEach(function(tb){
    var x0 = tb.col * cw, y0 = top + tb.level * ch, cx = x0 + gcx, cy = y0 + gcy, n = tb.cap, k = tb.used, over = k > n;
    var R = four ? (n <= 14 ? 26 : 27) : (n <= 14 ? 44 : 46), c = four ? (n <= 14 ? 4.5 : 4) : (n <= 14 ? 7.5 : 7), sw = four ? 1.5 : 2;
    var fill = tb.mainCat ? cat(tb.mainCat).color : '#FFFFFF';
    var isCur = mf && mf.table === tb.num, free = n - k, fits = mf && !isCur && free >= need;
    var hasDup = dupIds && tb.fams.some(function(f){ return dupIds.indexOf(f.id) >= 0; });
    var cls = 'tbl', act = 'table';

    s += '<g class="' + cls + '"' + (act ? ' role="button" tabindex="0" data-act="' + act + '" data-num="' + tb.num + '"' : ' aria-disabled="true"') + ' aria-label="' + esc(aria) + '">';
    s += '<rect class="cell" x="' + (x0 + 1) + '" y="' + (y0 + 1) + '" width="' + (cw - 2) + '" height="' + (ch - 2) + '" rx="10"/>';
    s += '<g aria-hidden="true">';

    var dstroke = over ? COL.danger : COL.border, dsw = over ? 3 : 1;

    s += '<circle cx="' + cx + '" cy="' + cy + '" r="' + r + '" fill="' + fill + '" stroke="' + dstroke + '" stroke-width="' + dsw + '"/>';
    if (fits) s += '<circle cx="' + cx + '" cy="' + cy + '" r="' + (r + 3) + '" fill="none" stroke="' + COL.success + '" stroke-width="3" stroke-dasharray="5 3"/>';
    var owners = chairOwners(tb);
    for (var i = 0; i < n; i++){

    var lblY = four ? y0 + 76 : y0 + 112, lfs = four ? 14 : 16;

/* ============ history / undo ============ */
function snapshot(){ return JSON.stringify({families:state.families, order:state.order, cats:state.cats, checked:state.checked, hall:state.hall}); }
function restore(snap){ var s = JSON.parse(snap); state.families = s.families; state.order = s.order; state.cats = s.cats; state.checked = s.checked; state.hall = s.hall; save(); }
function famState(f){ return {id:f.id, table:f.table, locked:f.locked, by:f.lockedBy}; }
function applyFams(arr){
  var rerun = false;
  arr.forEach(function(x){ var f = fam(x.id); if (!f) return; f.table = x.table; f.locked = x.locked; f.lockedBy = x.by || null; if (!x.locked) rerun = true; if (x.locked) f.seq = state.seq++; });
  return rerun;
}
function applyData(kind, d){
  if (kind === 'move' || kind === 'unlock') { if (applyFams(d)) autoSeat(state); }
  else if (kind === 'reorder') { state.order = d.slice(); autoSeat(state); }
  else if (kind === 'hall') { state.hall = Object.assign({}, d.hall); applyFams(d.fams || []); autoSeat(state); }
}
function addHist(e){ e.id = 'h' + (state.hid++); e.ts = Date.now(); e.who = state.role; state.history.unshift(e); return e; }
function undoEntry(id){
  var e = null; state.history.forEach(function(x){ if (x.id === id) e = x; });
  if (!e || e.undone || e.kind === 'answer') return null;
  applyData(e.kind, e.before);
  e.undone = {ts:Date.now(), who:state.role};
  var ne = {kind:e.kind, revert:!e.revert, names:e.names, from:e.to, to:e.from, cat:e.cat, fromPos:e.toPos, toPos:e.fromPos, hallB:e.hallA, hallA:e.hallB, before:e.after, after:e.before};
  addHist(ne); save();
  return ne;
}
function histText(e){
  var title = '', line = '';
  if (e.kind === 'move'){ title = e.names.join(', '); line = t((e.from || '—') + ' → ' + e.to + '-үстел', 'стол ' + (e.from || '—') + ' → ' + e.to); }
  else if (e.kind === 'unlock'){ title = e.names.join(', '); line = e.revert ? t('Қайта бекітілді: ' + e.to + '-үстел', 'Снова закреплено: стол ' + e.to) : t('Автоматқа қайтарылды', 'Возвращено автоматике'); }

  var k = el.dataset.k, S = STEPS[k], d = +el.dataset.d, v = S.get() + d;
  if (v < S.min || v > S.max) { try { if (navigator.vibrate) navigator.vibrate(30); } catch (x) {} stepMsg(k, v < S.min ? S.lo() : S.hi()); return; }
  S.set(v); stepUpdate(k);
};
A.stepEdit = function(el){
  var k = el.dataset.k, S = STEPS[k];
  el.innerHTML = '<input class="step-input" type="text" inputmode="numeric" pattern="[0-9]*" value="' + S.get() + '" aria-label="' + esc(S.lbl()) + '">';
  var i = el.querySelector('input'); i.focus(); i.select();
  i.addEventListener('click', function(ev){ ev.stopPropagation(); });
  i.addEventListener('blur', function(){
    var v = parseInt(i.value.replace(/\D/g, ''), 10);
    if (isNaN(v)) v = S.get();
    if (v < S.min) { stepMsg(k, S.lo()); v = S.min; } if (v > S.max) { stepMsg(k, S.hi()); v = S.max; }
    S.set(v); stepUpdate(k);
  });
};
A.submitGuest = function(){ submitGuest(); };
A.simSame = function(){
  var d = fam(ui.sims[0]); ui.allowLeave = true; ui.form = null; closeSheetDom();
  backTo('/guests', function(){ toast(t('Қосылмады: ' + d.name + ' тізімде бар', 'Не добавлено: ' + d.name + ' уже в списке')); });
};
A.simOther = function(){ commitGuest(ui.sims || []); };
A.addMore = function(){ ui.form = newForm(); closeSheet(function(){ var i = $('in-name'); if (i) { i.value = ''; i.focus(); } }); };
A.toList = function(){ var id = ui.lastAdded; ui.allowLeave = true; ui.form = null; closeSheetDom(); backTo('/guests', function(){ ui.highlight = id; refresh(); }); };

/* guest sheet */
A.gYes = function(){ var g = fam(ui.gs.id); ui.gs.yes = !ui.gs.yes; ui.gs.n = g.status === 'yes' ? g.confirmed : g.expected; paintSheet(); };
A.gYesSave = function(){
  var g = fam(ui.gs.id), snap = snapshot(), n = ui.gs.n, nm = g.name;
  g.status = 'yes'; g.confirmed = n; g.answeredBy = 'member'; g.respondedAt = Date.now();
  autoSeat(state); save();
  closeSheet(function(){ toast(t(nm + ': келеді, ' + n + ' орын', nm + ': придут, ' + nSeats(n)), function(){ restore(snap); refresh(); }); });
};
A.gNo = function(){
  var g = fam(ui.gs.id), snap = snapshot(), nm = g.name;
  g.status = 'no'; g.answeredBy = 'member'; g.respondedAt = Date.now();
  autoSeat(state); save();
  closeSheet(function(){ toast(t(nm + ': келмейді', nm + ': не придут'), function(){ restore(snap); refresh(); }); });
};
A.gEdit = function(){ var id = ui.gs.id; ui.form = null; ui.allowLeave = false; sheetGo('/guests/edit/' + id); };
A.gDel = function(){ ui.gs.del = true; paintSheet(); };
A.gDelNo = function(){ ui.gs.del = false; paintSheet(); };
A.gDelYes = function(){
  var g = fam(ui.gs.id), snap = snapshot(), nm = g.name;
  state.families = state.families.filter(function(x){ return x.id !== g.id; });
  save(); /* deletion frees seats; no reshuffle (P11, 4.16) */
  closeSheet(function(){ toast(t(nm + ' өшірілді', nm + ' удалены из списка'), function(){ restore(snap); refresh(); }); });
};

/* hall */
A.hallMode = function(el){ ui.hallMode = el.dataset.v; refresh(); };
A.expand = function(el){ var n = el.dataset.num; ui.expanded[n] = !ui.expanded[n]; refresh(); var b = document.querySelector('[data-act="expand"][data-num="' + n + '"]'); if (b) b.focus({preventScroll:true}); };
A.table = function(el){
  var n = +el.dataset.num; el.classList.add('tap');
  setTimeout(function(){ el.classList.remove('tap'); openTableSheet(n); }, 120);
};
A.couple = function(el){
  if (el.classList) el.classList.add('tap');
  setTimeout(function(){
    if (el.classList) el.classList.remove('tap');
    openSheet('couple', function(){ return {title:t('Жастар үстелі · Айбек пен Дана', 'Стол молодых · Айбек пен Дана'), body:'<div class="center">' + motif(64, 32) + '<p>' + t('Жастар төрде отырады', 'Молодые сидят на төре') + '</p></div>', foot:'<button class="btn btn-sec" data-act="sheetClose">' + t('Жабу', 'Закрыть') + '</button>'}; });
  }, 120);
};
A.overBanner = function(){
  var S = tableStats(state), nums = S.over.map(function(tb){ return tb.num; });
  if (nums.length > 1 && ui.hallMode === 'schema') { var sc = $('schema'); if (sc) sc.scrollIntoView({block:'start'}); }
  openTableSheet(nums[0], nums.length > 1 ? nums : null);
};
A.nextTable = function(el){ ui.tsNum = +el.dataset.num; paintSheet(true); };
A.unplaced = openUnplaced;
A.addTables = function(el){ var n = +el.dataset.n || 1; ui.setup = Object.assign({}, state.hall); ui.setup.count = Math.min(40, ui.setup.count + n); sheetGo('/hall/setup'); };
A.dupBanner = openDupSheet;
A.dupShow = function(el){
  var p = dupPairs(state)[+el.dataset.i]; ui.dup = [p[0].id, p[1].id]; ui.hallMode = 'schema';
  closeSheet(function(){ var sc = $('schema'); if (sc) sc.scrollIntoView({block:'start'}); });
};
A.dupOff = function(){ ui.dup = null; refresh(); };
A.dupKeep = function(el){
  var p = dupPairs(state)[+el.dataset.i], snap = snapshot();
  state.checked.push(pairKey(p[0].id, p[1].id)); save(); ui.dup = null;
  closeSheet(function(){ toast(t('Жарайды, екеуі де қалды', 'Хорошо, оба остались'), function(){ restore(snap); refresh(); }); });
};
A.dupDelOne = function(el){ var p = dupPairs(state)[+el.dataset.i]; ui.dd = {pair:[p[0].id, p[1].id], pick:p[0].id}; paintSheet(true); };
A.ddPick = function(el){ ui.dd.pick = el.dataset.v; paintSheet(); var b = document.querySelector('[data-act="ddPick"][data-v="' + el.dataset.v + '"]'); if (b) b.focus(); };
A.ddBack = function(){ ui.dd = null; paintSheet(true); };
A.ddDelete = function(){
  var g = fam(ui.dd.pick), snap = snapshot(), nm = g.name;
  state.families = state.families.filter(function(x){ return x.id !== g.id; });
  save(); /* deletion frees seats; no reshuffle (P11, 4.16) */ ui.dd = null; ui.dup = null;
  closeSheet(function(){ toast(t(nm + ' өшірілді', nm + ' удалены'), function(){ restore(snap); refresh(); }); });
};
A.move = function(el){ ui.moveOthers = false; sheetGo('/hall/move/' + el.dataset.id); };
A.moveOthers = function(){ ui.moveOthers = !ui.moveOthers; refresh(); };
A.moveCancel = function(){ goBack('/hall'); };
A.moveTo = function(el){
  var m = /^\/hall\/move\/(\w+)$/.exec(curPath); if (!m) return;
  var n = +el.dataset.num;
  if (el.tagName !== 'BUTTON') { el.classList.add('tap'); setTimeout(function(){ el.classList.remove('tap'); openMoveConfirm(m[1], n); }, 120); }
  else openMoveConfirm(m[1], n);
};
A.moveYes = function(){
  var e = doMove(ui.mv.fid, ui.mv.num), f = fam(ui.mv.fid);
  var msg = t(f.name + ' ' + ui.mv.num + '-үстелге ауыстырылды', f.name + ' перенесены за стол ' + ui.mv.num);
  closeSheetDom();
  backTo('/hall', function(){ toast(msg, function(){ undoEntry(e.id); refresh(); }); });
};
A.unlock = function(el){
  var f = fam(el.dataset.id), before = [famState(f)], from = f.table;
  f.locked = false; f.lockedBy = null;
  autoSeat(state);
  var e = addHist({kind:'unlock', names:[f.name], from:from, to:from, before:before, after:[famState(f)]});
  save();
  closeSheet(function(){ toast(t(f.name + ': автоматқа қайтарылды' + (f.table ? ' · ' + f.table + '-үстел' : ''), f.name + ': возвращено автоматике' + (f.table ? ' · стол ' + f.table : '')), function(){ undoEntry(e.id); refresh(); }); });
};
A.setCols = function(el){ ui.setup.cols = +el.dataset.v; refresh(); var b = document.querySelector('[data-act="setCols"][data-v="' + el.dataset.v + '"]'); if (b) b.focus(); };
A.setupSave = setupSave;
A.ordMove = function(el){ ordMove(el.dataset.cat, +el.dataset.d); };
A.histUndo = function(el){
  var ne = undoEntry(el.dataset.id); if (!ne) return;
  refresh();
  toast(histToast(ne), function(){ undoEntry(ne.id); refresh(); });
};

/* ============ boot ============ */
(function(){
  var r = parseRoute();
  try { history.replaceState({idx:0}, '', location.href.split('#')[0] + '#' + (r.path || (state.started ? '/guests' : '/start'))); navStack[0] = '#' + (r.path || (state.started ? '/guests' : '/start')); }
  catch (e) { canPush = false; }
  render();
})();
</script>
</body>
</html>
