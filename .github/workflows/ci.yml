name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: "1"
  COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"

jobs:
  checks:
    name: messages · typecheck · lint · test · build · e2e
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: toi
          POSTGRES_PASSWORD: toi
          POSTGRES_DB: toi
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U toi"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Ephemeral CI database (service container), not a secret.
      DATABASE_DRIVER: pg
      DATABASE_URL: postgres://toi:toi@localhost:5432/toi
      DATABASE_URL_UNPOOLED: postgres://toi:toi@localhost:5432/toi
      APP_URL: http://localhost:3100
      APP_DOMAIN: toi-pilot.vercel.app
      SMS_PROVIDER: console

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4 # version from package.json "packageManager"

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Check messages (content/messages)
        run: pnpm check:messages

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit tests (with coverage)
        run: pnpm test:coverage --project unit

      - name: Integration tests (postgres:16, migrations from scratch)
        run: pnpm test:integration
        env:
          TEST_DATABASE_URL: postgres://toi:toi@localhost:5432/toi

      - name: Build
        run: pnpm build
        env:
          GIT_COMMIT: ${{ github.sha }}

      - name: Migrate CI database
        run: pnpm db:migrate

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Generate throw-away secrets for the test server
        run: |
          for v in SESSION_SECRET OTP_HMAC_SECRET CRON_SECRET; do
            echo "::add-mask::$(openssl rand -base64 32 | tee /tmp/$v)"
            echo "$v=$(cat /tmp/$v)" >> "$GITHUB_ENV"
          done

      - name: Playwright e2e — smoke + login by link and by code (mobile 360×740 + desktop 1440×900, standalone server)
        run: pnpm test:e2e
        env:
          E2E_PORT: "3100"
          GIT_COMMIT: ${{ github.sha }}

      - name: S1 performance — 3 repeats, strict; fails on > 30 % growth of the warm median (Ф6 review П2)
        run: pnpm exec playwright test tests/e2e/guests-perf.spec.ts --project=mobile --repeat-each=3 --workers=1 --retries=0
        env:
          E2E_PORT: "3100"
          GIT_COMMIT: ${{ github.sha }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
          if-no-files-found: ignore

  docker:
    name: docker build (no push)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: toi:ci
          build-args: GIT_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Container instead of gitleaks-action: no license needed for organisation repos.
      - name: Scan full git history
        run: >-
          docker run --rm -v "${{ github.workspace }}:/repo" ghcr.io/gitleaks/gitleaks:v8.24.0
          detect --source /repo --redact --verbose --exit-code 1
