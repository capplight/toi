name: Deploy production

# Plan 11.3 / brief Ф2: migrations first, then the prebuilt deploy. Vercel's own Git deploy of `main`
# is switched off in vercel.json (git.deploymentEnabled.main = false).
# Secrets (added by the founder in GitHub → Settings → Secrets and variables → Actions):
#   VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID, PROD_DATABASE_URL_UNPOOLED
on:
  push:
    branches: [main]
    # Ф2 review Н11: document-only commits do not redeploy production. content/messages is NOT ignored
    # (UI texts ship with the app). GitHub skips the run only if every changed file matches these patterns.
    paths-ignore:
      - "docs/**"
      - "architecture/**"
      - "design/**"
      - "research/**"
      - "prototype/**"
      - "HANDOVER_v2.md"
      - "AGENTS.md"
      - "CLAUDE.md"
      - "README.md"
      - "content/*.md"
      - "content/site/**"
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false

permissions:
  contents: read

env:
  COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
  NEXT_TELEMETRY_DISABLED: "1"
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  deploy:
    # Until the legal pages are final and real R2/SMSC keys are set, pushes would only fail at the strict legal
    # check and email the founder. Push deploys start once the repository variable PROD_DEPLOY_ENABLED = true;
    # a manual run (workflow_dispatch) always goes ahead.
    if: github.event_name == 'workflow_dispatch' || vars.PROD_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Check messages
        run: pnpm check:messages

      # RA review П3: the lawyer's notes [ЮРИСТ …] in /privacy and /terms must not reach production users.
      # Local and preview only warn (check:messages); production fails here until the lawyer's final text.
      - name: Legal pages are final (no [ЮРИСТ …] notes)
        run: pnpm check:legal:strict

      # Expand-only migrations (plan 11.3): old and new code both work with the new schema.
      - name: Migrate production database
        run: pnpm db:migrate
        env:
          DATABASE_URL_UNPOOLED: ${{ secrets.PROD_DATABASE_URL_UNPOOLED }}

      - name: Pull Vercel production settings
        run: pnpm dlx vercel@63.1.0 pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build
        run: pnpm dlx vercel@63.1.0 build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy (prebuilt)
        run: pnpm dlx vercel@63.1.0 deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
