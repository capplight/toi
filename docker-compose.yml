# Optional local services (plan 11.2). Not required: the founder's machine has no Docker,
# local development uses the Neon `dev` branch. Kept for the KZ-hosting path and contributors with Docker.
#
#   docker compose up -d
#   DATABASE_DRIVER=pg
#   DATABASE_URL=postgres://toi:toi@localhost:5432/toi
#   DATABASE_URL_UNPOOLED=postgres://toi:toi@localhost:5432/toi
#   S3_ENDPOINT=http://localhost:9000  S3_BUCKET=toi-local  S3_ACCESS_KEY_ID=toi  S3_SECRET_ACCESS_KEY=toi-local-secret
#
# Credentials below are local-only placeholders, not secrets.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: toi
      POSTGRES_PASSWORD: toi
      POSTGRES_DB: toi
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U toi"]
      interval: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: toi
      MINIO_ROOT_PASSWORD: toi-local-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio:/data

volumes:
  pgdata:
  minio:
